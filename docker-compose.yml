services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      # 容器内通过服务名访问 redis，覆盖 .env 中的 localhost
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./chroma_db:/app/chroma_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
